# ---------------------
# DATASOURCE
# ---------------------
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db
spring.datasource.username=root
spring.datasource.password=123456

# ---------------------
# JPA
# ---------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.hibernate.ddl-auto=update

# ---------------------
# JWT
# ---------------------
# Base64 signing key: at least 32 decoded bytes for HS256.
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Th?i h?n token: 86400000 ms = 24 gi?
jwt.expiration=86400000

# ShopeePay MPM Vietnam
shopeepay.enabled=${SHOPEEPAY_ENABLED:false}
shopeepay.base-url=${SHOPEEPAY_BASE_URL:https://api.uat.wallet.airpay.vn}
shopeepay.client-id=${SHOPEEPAY_CLIENT_ID:}
shopeepay.secret-key=${SHOPEEPAY_SECRET_KEY:}
shopeepay.merchant-ext-id=${SHOPEEPAY_MERCHANT_EXT_ID:}
shopeepay.store-ext-id=${SHOPEEPAY_STORE_EXT_ID:}
shopeepay.callback-signature-header=${SHOPEEPAY_CALLBACK_SIGNATURE_HEADER:X-Airpay-Req-H}
shopeepay.response-signature-header=${SHOPEEPAY_RESPONSE_SIGNATURE_HEADER:X-Airpay-Resp-H}

sepay.enabled=${SEPAY_ENABLED:false}
sepay.bank=${SEPAY_BANK:}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.webhook-secret=${SEPAY_WEBHOOK_SECRET:}
